[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-rl"
version = "0.1.0"
description = "Query-only embedding RL with cached relevance judgments, Modal, and W&B"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
embedding-rl = "embedding_rl.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["embedding_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

